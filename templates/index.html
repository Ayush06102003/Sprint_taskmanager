<!DOCTYPE html>
<html>

<head>
    <title>Sprint Task Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
        }

        h2 {
            color: #333;
        }

        form {
            margin-bottom: 10px;
        }

        input,
        select {
            padding: 8px;
            margin: 4px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 8px 14px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn {
            background-color: #28a745;
        }

        .add-btn:hover {
            background-color: #218838;
        }

        .update-btn {
            background-color: #007bff;
        }

        .update-btn:hover {
            background-color: #0056b3;
        }

        .reset-btn {
            background-color: #6c757d;
        }

        .reset-btn:hover {
            background-color: #545b62;
        }

        .delete-btn {
            background-color: #dc3545;
        }

        .delete-btn:hover {
            background-color: #b02a37;
        }

        .filter-btn {
            background-color: #6f42c1;
        }

        .filter-btn:hover {
            background-color: #563d7c;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 1200px;
            border-collapse: collapse;
            background: white;
        }

        th {
            background-color: #343a40;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
        }

        th,
        td {
            border: 1px solid #ddd;
            text-align: left;
            vertical-align: top;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        tr:hover {
            background-color: #eef4ff;
        }

        .action-form {
            margin-bottom: 5px;
        }

        @media screen and (max-width: 768px) {

            body {
                margin: 10px;
            }

            input,
            select,
            button {
                width: 100%;
                margin-bottom: 8px;
            }
        }
    </style>
</head>

<body>

    <h2>📄 Sprint Task Manager</h2>

    <!-- FILTER -->

    <form method="get">

        <input type="text" name="assignee" placeholder="Filter Assignee">

        <select name="status">
            <option value="">All Status</option>
            <option>Not Started</option>
            <option>Started</option>
            <option>In Progress</option>
            <option>Completed</option>
            <option>Blocked</option>
        </select>

        <input type="text" name="sprint" placeholder="Filter Sprint">

        <button type="submit" class="filter-btn">
            Filter
        </button>

        <button type="button" class="reset-btn" onclick="window.location.href='/'">
            Reset
        </button>

        <a href="/export_excel">
            <button type="button" class="add-btn">
                Export Excel
            </button>
        </a>
    </form>
    <hr>

    <!-- ADD FORM -->

    <form action="/add" method="post">

        <input name="assignee" placeholder="Assignee" required>

        <input name="sprint" placeholder="Sprint" required>

        <input name="epic" placeholder="Epic" required>

        <input name="task" placeholder="Task" required>

        <select name="status">
            <option selected>Not Started</option>
            <option>Started</option>
            <option>In Progress</option>
            <option>Completed</option>
            <option>Blocked</option>
        </select>

        <input type="number" name="effort" placeholder="Effort (hrs)" required>

        <input type="number" name="hours_spent" value="0" min="0" required>

        <input name="comment" placeholder="Comment (optional)">

        <button type="submit" class="add-btn">
            Add
        </button>

    </form>

    <hr>

    <div class="table-container">

        <table>

            <tr>
                <th>Sprint</th>
                <th>Assignee</th>
                <th>Epic</th>
                <th>Task</th>
                <th>Status</th>
                <th>Effort</th>
                <th>Spent</th>
                <th>Remaining</th>
                <th>Comment</th>
                <th>Action</th>
            </tr>

            {% for t in tasks %}
            <tr>
                <td>{{ t[3] }}</td>
                <td>{{ t[1] }}</td>
                <td>{{ t[4] }}</td>
                <td>{{ t[5] }}</td>
                <td>{{ t[6] }}</td>
                <td>{{ t[7] }}</td>
                <td>{{ t[8] }}</td>
                <td>{{ t[9] }}</td>
                <td>{{ t[10] }}</td>

                <td>

                    <!-- UPDATE -->

                    <form action="/update/{{ t[0] }}" method="post" class="action-form">

                        <select name="status">
                            <option>Not Started</option>
                            <option>Started</option>
                            <option>In Progress</option>
                            <option>Completed</option>
                            <option>Blocked</option>
                        </select>

                        <input type="number" name="hours_spent" value="{{ t[8] }}" min="0">

                        <input name="comment" placeholder="Comment">

                        <button type="submit" class="update-btn">
                            Update
                        </button>

                    </form>

                    <!-- DELETE -->

                    <form action="/delete/{{ t[0] }}" method="post">

                        <button type="submit" class="delete-btn" onclick="return confirm('Delete this task?')">
                            Delete
                        </button>

                    </form>

                </td>

            </tr>
            {% endfor %}

        </table>

    </div>

</body>

</html>
