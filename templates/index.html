<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }

        input, select {
            padding: 8px;
            margin: 5px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }

        button {
            padding: 6px 10px;
            cursor: pointer;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }

        .update-btn {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .update-btn:hover {
            background-color: #0056b3;
        }

        .add-btn {
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .add-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<h2>📄 Sprint Task Manager</h2>

<form action="/add" method="post">
    <input type="text" name="assignee" placeholder="Assignee" required>
    <input type="text" name="task" placeholder="Task" required>

    <select name="status">
        <option>Started</option>
        <option>In Progress</option>
        <option>Completed</option>
        <option>Blocked</option>
    </select>

    <button type="submit" class="add-btn">Add Task</button>
</form>

<table>
    <tr>
        <th>ID</th>
        <th>Assignee</th>
        <th>Date</th>
        <th>Task</th>
        <th>Status</th>
        <th>Update</th>
        <th>Delete</th>
    </tr>

    {% for t in tasks %}
    <tr>
        <td>{{ t[0] }}</td>
        <td>{{ t[1] }}</td>
        <td>{{ t[2] }}</td>
        <td>{{ t[3] }}</td>
        <td>{{ t[4] }}</td>

        <td>
            <form action="/update/{{ t[0] }}" method="post">
                <select name="status">
                    <option>Started</option>
                    <option>In Progress</option>
                    <option>Completed</option>
                    <option>Blocked</option>
                </select>

                <button type="submit" class="update-btn">
                    Update
                </button>
            </form>
        </td>

        <td>
            <form action="/delete/{{ t[0] }}" method="post">
                <button
                    type="submit"
                    class="delete-btn"
                    onclick="return confirm('Are you sure you want to delete this task?');">
                    Delete
                </button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
